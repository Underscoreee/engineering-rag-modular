[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engineering-rag"
version = "0.1.0"
description = "Typed architecture contracts for an engineering-document RAG system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_rag"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests", "src/engineering_rag/modules"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["ARCHITECTURE_TASK_0_1_PROMPT.md", "references", "test_freeze_gaps.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

