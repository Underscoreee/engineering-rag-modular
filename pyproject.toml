[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engineering-rag"
version = "0.1.0"
description = "Typed architecture contracts for an engineering-document RAG system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
parser = ["Pillow>=10,<13", "PyMuPDF>=1.24,<2"]
parser-ocr = [
    "onnxruntime>=1.16,<2",
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "rapidocr-onnxruntime>=1.4,<2",
]
keyword-retrieval = ["elasticsearch>=8.15,<9"]
vector-retrieval = [
    "pymilvus>=2.5,<2.6",
    "sentence-transformers>=3.3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_rag"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests", "src/engineering_rag/modules"]
markers = [
    "real_elasticsearch: integration tests requiring a configured Elasticsearch 8.x service",
    "real_mineru: local replay tests requiring saved MinerU/PDF artifacts",
    "real_chunking: local regression tests requiring a saved real Document V2.4 artifact",
    "real_milvus: integration tests requiring a configured Milvus 2.5 service",
    "real_embedding: smoke tests requiring the configured Sentence-Transformers model",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "ARCHITECTURE_TASK_0_1_PROMPT.md",
    "references",
    "test_freeze_gaps.py",
    "test_task1_1_audit_gaps.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

